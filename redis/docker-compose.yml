# Bare redis, for when you just need a cache and don't want a whole stack.
#   cd redis && docker compose up -d
# Connect from the host: redis-cli -h 127.0.0.1 -p 6379
#
# I keep persistence ON here (unlike the nginx example) because local dev data
# surviving a restart is handy. In the nginx example redis is disposable.

services:
  redis:
    image: redis:7.2-alpine
    container_name: dev-redis
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
