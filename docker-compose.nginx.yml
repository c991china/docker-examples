# Nginx reverse proxy in front of the flask demo.
# Usage: docker compose -f docker-compose.nginx.yml up --build
#
# The app container is NOT published to the host. Only nginx is. That is
# deliberate: I've been bitten by leaving an app port open on 0.0.0.0 and
# discovering it weeks later.

services:
  web:
    build:
      context: ./flask
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - frontend

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
