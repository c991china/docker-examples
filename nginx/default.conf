# Referenced by docker-compose.nginx.yml. Proxies everything to the flask app
# and adds a couple of headers. Note the trailing slash on proxy_pass: without
# it nginx forwards the /-prefixed URI unchanged, which is what we want here.

upstream flask_app {
    server web:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    # Don't leak nginx version in error pages.
    server_tokens off;

    location /health {
        # bypass the app for pure liveness checks if you want
        proxy_pass http://flask_app/health;
        access_log off;
    }

    location / {
        proxy_pass http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
